# Catalogo vivo auditado. Scores finales = blend(prior curado, evidencia).
# Regenerado por `autotier bench import`. Fuentes:
# - gpqa-diamond [reasoning] https://openrouter.ai/benchmarks/gpqa-diamond (2026-09-09)
# - swe-bench-verified [code] https://benchlm.ai/benchmarks/swe-bench-verified (2026-09-09)
models:
  - id: haiku-tier
    examples: [claude-haiku-4-5, gpt-4o-mini, kimi-k2-lite]
    cost_in_per_1m: 1.0
    cost_out_per_1m: 5.0
    context_window: 200000
    latency_p95_ms: 800
    scores: {code: 7, data_analysis: 6, design: 5, general: 6, multimodal: 5, ocr: 7, presentation: 6, reasoning: 6, research: 6, tool_use: 6}
  - id: balanced-tier
    examples: [claude-sonnet-4-6, gpt-5.x, kimi-k2.5]
    cost_in_per_1m: 3.0
    cost_out_per_1m: 15.0
    context_window: 1000000
    latency_p95_ms: 2000
    scores: {code: 8, data_analysis: 8, design: 8, general: 8, multimodal: 8, ocr: 8, presentation: 8, reasoning: 8, research: 8, tool_use: 8}
  - id: frontier-tier
    examples: [claude-opus-5, gpt-5.x-high, kimi-k2-thinking]
    cost_in_per_1m: 5.0
    cost_out_per_1m: 25.0
    context_window: 1000000
    latency_p95_ms: 4500
    scores: {code: 9, data_analysis: 9, design: 9, general: 9, multimodal: 9, ocr: 9, presentation: 9, reasoning: 9, research: 9, tool_use: 9}

tool_dialects:
  kimi-k2: kimi_k2_vllm
  kimi-k2-thinking: kimi_k2_vllm
  default_kimi: openai_json_xml
